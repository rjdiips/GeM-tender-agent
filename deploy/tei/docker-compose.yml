# Embedding + rerank services for the GeM tender agent, to be reached over the LAN by
# an app running on another machine.
#
# The embedder runs on the CPU whenever vLLM holds the GPU (--gpu-memory-utilization 0.95
# leaves well under a gigabyte, and lowering it is off the table). `docker compose up -d`
# starts that CPU container and the optional reranker; the GPU variant is behind the `gpu`
# profile and is started explicitly after stopping the CPU one, because both bind 8080.
# Neither TEI nor Compose can choose between them at run time: TEI is built per backend
# (cpu-1.9 vs 1.9) and Compose cannot pick an image from live VRAM. Both serve
# all-MiniLM-L6-v2, the measured default (spec 3.5.1).
name: gem-tei

x-tei: &tei
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
  restart: unless-stopped
  volumes:
    - tei-models:/data
  environment:
    HF_HOME: /data
  security_opt:
    - no-new-privileges:true

x-embed: &embed
  command:
    - --model-id=${EMBED_MODEL_ID:-sentence-transformers/all-MiniLM-L6-v2}
    - --port=80
    - --auto-truncate
    - --max-batch-tokens=4096
    - --max-client-batch-size=64
    - --max-concurrent-requests=128
    - --tokenization-workers=4
  ports:
    - "${TEI_HOST:-0.0.0.0}:8080:80"

services:
  embed:
    <<: [*tei, *embed]
    # Leave the rest of the 32 cores to vLLM's tokenizer and its 1 GB CPU offload.
    cpus: 6
    mem_limit: 3g

  # Started explicitly, after `docker compose stop embed`, when the GPU has room:
  #   docker compose stop embed && docker compose --profile gpu up -d embed-gpu
  # Same model and port as `embed`, so the app's EMBED_BASE_URL never changes; only one of
  # the two may run at a time.
  embed-gpu:
    <<: [*tei, *embed]
    image: ghcr.io/huggingface/text-embeddings-inference:1.9
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 8g

  rerank:
    <<: *tei
    command:
      - --model-id=${RERANK_MODEL_ID:-BAAI/bge-reranker-base}
      - --port=80
      - --auto-truncate
      - --max-batch-tokens=2048
      - --max-client-batch-size=64
      - --max-concurrent-requests=128
      - --tokenization-workers=4
    ports:
      - "${TEI_HOST:-0.0.0.0}:8081:80"
    cpus: 6
    mem_limit: 4g

volumes:
  tei-models:

# The daemon's default address pools are exhausted on this host (31 networks already),
# so give this project an explicit, unused subnet.
networks:
  default:
    ipam:
      config:
        - subnet: 10.99.0.0/24
