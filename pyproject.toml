[project]
name = "gem-agent"
version = "0.1.0"
description = "GeM tender agent: a harness with tools, skills, Monty sandbox, checks and memory"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # orchestration + agents
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic>=2",
    "pydantic-settings",
    "pydantic-ai-slim[openai]",
    # sandbox
    "pydantic-monty>=1.6,<1.7",
    # site access
    "httpx",
    "playwright",
    # documents
    "pypdf",
    "pymupdf",
    "pytesseract",
    # retrieval (GPU, CUDA build from PyPI)
    "torch",
    "sentence-transformers",
    "FlagEmbedding",
    "rank-bm25",
    # web chat
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "python-multipart",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
]

[project.scripts]
gem-agent = "gem_agent.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gem_agent"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits the real GeM site (run with -m live)", "slow: uses local OCR or models (a few seconds)"]
addopts = "-m 'not live'"
